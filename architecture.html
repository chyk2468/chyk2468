<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Engineering Build Loop</title><style>:root{--bg:#0D1117;--ink:#E3E4E5;--muted:#9D917A;--line:#373A26;--card:#171B16;--a:#818D42;--b:#A5C6E7;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;padding:clamp(20px,4vw,56px);background:var(--bg);color:var(--ink)}main{max-width:1200px;margin:auto}.tag{color:var(--a);text-transform:uppercase;letter-spacing:.16em;font-size:.75rem;font-weight:800}h1{font-size:clamp(2rem,5vw,3rem)}p{color:var(--muted);line-height:1.6}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;margin:36px 0}.stage{position:relative;overflow:hidden;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:24px 18px;min-height:200px;text-align:left;cursor:pointer;transition:transform .25s,border-color .25s}.stage:before{content:'';display:block;width:36px;height:4px;background:var(--a);margin-bottom:18px}.stage:hover,.stage:focus-visible,.stage[aria-pressed=true]{transform:translateY(-5px);border-color:var(--a);outline:none}.stage h2{font-size:1.1rem}.stage p{font-size:.9rem}.detail{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}.runner{position:absolute;left:0;top:0;width:8px;height:8px;background:var(--b);border-radius:50%;box-shadow:0 0 16px var(--b);animation:travel 8s linear infinite;pointer-events:none}@keyframes travel{0%{left:0;top:0}25%{left:99%;top:0}50%{left:99%;top:99%}75%{left:0;top:99%}100%{left:0;top:0}}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:500px){.grid{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}</style></head><body><main><div class="tag">Engineering / Build Loop</div><h1>From problem to shipped system</h1><p>A simple, repeatable cycle for building software. Select any stage to inspect the focus of that step.</p><section class="grid"><button class="stage" type="button" aria-pressed="true" data-i="0"><span class="tag">01 / Scope</span><h2>Name the problem</h2><p>Define the user, constraints, and success criteria.</p></button><button class="stage" type="button" aria-pressed="false" data-i="1"><span class="tag">02 / Design</span><h2>Map the system</h2><p>Choose boundaries, interfaces, and the smallest useful first slice.</p></button><button class="stage" type="button" aria-pressed="false" data-i="2"><span class="tag">03 / Build</span><h2>Implement and test</h2><p>Ship a working path and verify it with repeatable checks.</p></button><button class="stage" type="button" aria-pressed="false" data-i="3"><span class="tag">04 / Iterate</span><h2>Observe and improve</h2><p>Use real results to choose the next change.</p></button></section><section class="detail" aria-live="polite"><h2 id="heading">Name the problem</h2><p id="body">Define the user, constraints, and success criteria.</p></section><p><a style="color:var(--a)" href="https://github.com/chyk2468">Back to GitHub profile</a></p></main><script>const stages=[['Name the problem','Define the user, constraints, and success criteria.'],['Map the system','Choose boundaries, interfaces, and the smallest useful first slice.'],['Implement and test','Ship a working path and verify it with repeatable checks.'],['Observe and improve','Use real results to choose the next change.']];document.querySelectorAll('.stage').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.stage').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true');document.querySelector('#heading').textContent=stages[+b.dataset.i][0];document.querySelector('#body').textContent=stages[+b.dataset.i][1]}))</script></body></html>
