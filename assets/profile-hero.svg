<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Yashwant Kumar | AI Systems Engineer</title>
  <desc id="desc">A dark technical banner with a neural network orb and highlighted focus areas: local AI, RAG, agents, and explainable AI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B14"/>
      <stop offset="0.55" stop-color="#0B1425"/>
      <stop offset="1" stop-color="#101B32"/>
