<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-labelledby="title desc">
<title id="title">Veridex | Evidence-grounded fact intelligence</title><desc id="desc">Facts extracted from documents are normalized, compared, and linked to source evidence.</desc>
<defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0D1117"/><stop offset="1" stop-color="#373A26"/></linearGradient><linearGradient id="l" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#A5C6E7"/><stop offset="1" stop-color="#818D42"/></linearGradient></defs>
<rect width="900" height="320" rx="18" fill="url(#b)"/><path d="M24 24H876M24 296H876" stroke="#5E644D"/>
<text x="34" y="49" fill="#A5C6E7" font-family="monospace" font-size="12" letter-spacing="2">FLAGSHIP / 04</text><text x="34" y="83" fill="#E3E4E5" font-family="Arial" font-size="28" font-weight="700">Veridex</text><text x="34" y="105" fill="#9D917A" font-family="Arial" font-size="13">Cross-document facts, traceable evidence, explainable comparisons.</text>
<g fill="none" stroke="url(#l)" stroke-width="1.6"><path d="M151 165L280 165L385 165L500 165L635 165L765 165"/><path d="M151 165L280 221L385 165M500 165L635 111L765 165" opacity=".65"/></g>
