<g><rect x="48" y="135" width="126" height="62" rx="9" fill="#25291D" stroke="#6C7C3E"/><path d="M70 151h17l6 6v22H70zM87 151v7h6M74 164h14M74 170h14" fill="none" stroke="#A5C6E7"/><text x="122" y="162" fill="#E3E4E5" font-size="10">REPORTS</text><text x="122" y="177" fill="#9D917A" font-size="9">page evidence</text></g>
<g><rect x="220" y="135" width="120" height="62" rx="9" fill="#25291D" stroke="#6C7C3E"/><text x="280" y="161" fill="#E3E4E5" font-size="11">EXTRACT</text><text x="280" y="178" fill="#9D917A" font-size="9">facts + values</text></g>
<g><rect x="365" y="135" width="120" height="62" rx="9" fill="#25291D" stroke="#6C7C3E"/><text x="425" y="161" fill="#E3E4E5" font-size="11">NORMALIZE</text><text x="425" y="178" fill="#9D917A" font-size="9">units / context</text></g>
<g><rect x="510" y="135" width="120" height="62" rx="9" fill="#25291D" stroke="#6C7C3E"/><text x="570" y="161" fill="#E3E4E5" font-size="11">COMPARE</text><text x="570" y="178" fill="#9D917A" font-size="9">rules / relations</text></g>
