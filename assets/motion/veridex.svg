</g>
<g fill="#A5C6E7"><circle r="4"><animateMotion dur="5.2s" repeatCount="indefinite" path="M151 165H765"/></circle><circle r="3"><animateMotion dur="5.2s" begin="-2s" repeatCount="indefinite" path="M151 165H765"/></circle></g>
<text x="34" y="263" fill="#9D917A" font-family="monospace" font-size="11">EXTRACT → NORMALIZE → COMPARE → EXPLAIN WITH SOURCES</text>
<text x="34" y="281" fill="#9D917A" font-family="monospace" font-size="10">GROUNDING FIRST. NO GUESSING BETWEEN DOCUMENTS.</text>
