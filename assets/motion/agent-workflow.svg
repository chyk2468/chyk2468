<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-labelledby="title desc">
<title id="title">Agentic AI for Jira | Animated agent workflow</title><desc id="desc">A request flows through planning and tools to a human approval step, then execution.</desc>
<defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0A111B"/><stop offset="1" stop-color="#102431"/></linearGradient><linearGradient id="l" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5BE8CF"/><stop offset="1" stop-color="#7C83FF"/></linearGradient></defs>
<rect width="900" height="320" rx="18" fill="url(#b)"/><path d="M24 24H876M24 296H876" stroke="#254452"/>
<text x="34" y="49" fill="#87E9D7" font-family="monospace" font-size="12" letter-spacing="2">FLAGSHIP / 03</text><text x="34" y="83" fill="#F2FBFF" font-family="Arial" font-size="28" font-weight="700">Agentic AI for Jira</text><text x="34" y="105" fill="#B0C7D0" font-family="Arial" font-size="13">Natural language to reviewed, actionable workflows.</text>
<path d="M126 176H776" stroke="#3F6478" stroke-width="2" stroke-dasharray="6 8"><animate attributeName="stroke-dashoffset" from="0" to="-56" dur="3s" repeatCount="indefinite"/></path>
<g font-family="monospace" text-anchor="middle">
  <rect x="42" y="143" width="122" height="67" rx="10" fill="#142632" stroke="#397C82"/><text x="103" y="170" fill="#E0FFF9" font-size="12">REQUEST</text><text x="103" y="188" fill="#8FCBBF" font-size="10">plain language</text>
  <rect x="207" y="143" width="122" height="67" rx="10" fill="#142632" stroke="#397C82"/><text x="268" y="170" fill="#E0FFF9" font-size="12">PLAN</text><text x="268" y="188" fill="#8FCBBF" font-size="10">break into steps</text>
  <rect x="372" y="143" width="122" height="67" rx="10" fill="#17213A" stroke="#6B71B9"/><text x="433" y="170" fill="#E8E6FF" font-size="12">TOOL CALL</text><text x="433" y="188" fill="#ABA9E8" font-size="10">Jira + retrieval</text>
  <rect x="537" y="143" width="142" height="67" rx="10" fill="#2B2419" stroke="#B88B49"><animate attributeName="stroke" values="#B88B49;#F2C879;#B88B49" dur="2.8s" repeatCount="indefinite"/></rect><text x="608" y="170" fill="#FFF2D2" font-size="12">HUMAN CHECK</text><text x="608" y="188" fill="#E6C78F" font-size="10">approve / edit</text>
  <rect x="722" y="143" width="136" height="67" rx="10" fill="#112E29" stroke="#3D9F86"/><text x="790" y="170" fill="#DAFFF5" font-size="12">EXECUTE</text><text x="790" y="188" fill="#8DD9C7" font-size="10">tracked action</text>
</g>
<g fill="#61EBD3"><circle r="4"><animateMotion dur="5s" repeatCount="indefinite" path="M103 176H790"/></circle><circle r="3"><animateMotion dur="5s" begin="-2.2s" repeatCount="indefinite" path="M103 176H790"/></circle></g>
<path d="M608 210v30h-175v-30" fill="none" stroke="#B88B49" stroke-width="1.2" stroke-dasharray="4 5"><animate attributeName="stroke-dashoffset" from="0" to="-36" dur="3s" repeatCount="indefinite"/></path>
<text x="521" y="257" text-anchor="middle" fill="#D8BA86" font-family="monospace" font-size="10">SAFETY GATE BEFORE ACTION</text>
<text x="34" y="276" fill="#6F9AA6" font-family="monospace" font-size="11">UNDERSTAND → PLAN → RETRIEVE → REVIEW → ACT</text>
</svg>