<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-labelledby="title desc">
<title id="title">Agentic AI for Jira | Animated agent workflow</title><desc id="desc">A request flows through planning and tools to a human approval step, then execution.</desc>
<defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11130F"/><stop offset="1" stop-color="#24291E"/></linearGradient><linearGradient id="l" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#F16A3A"/><stop offset="1" stop-color="#A5B58A"/></linearGradient></defs>
<rect width="900" height="320" rx="18" fill="url(#b)"/><path d="M24 24H876M24 296H876" stroke="#414437"/>
<text x="34" y="49" fill="#F3A16D" font-family="monospace" font-size="12" letter-spacing="2">FLAGSHIP / 03</text><text x="34" y="83" fill="#F4EBDD" font-family="Arial" font-size="28" font-weight="700">Agentic AI for Jira</text><text x="34" y="105" fill="#C7C1B2" font-family="Arial" font-size="13">Natural language to reviewed, actionable workflows.</text>
<path d="M126 176H776" stroke="#596544" stroke-width="2" stroke-dasharray="6 8"><animate attributeName="stroke-dashoffset" from="0" to="-56" dur="3s" repeatCount="indefinite"/></path>
<g font-family="monospace" text-anchor="middle">
  <rect x="42" y="143" width="122" height="67" rx="10" fill="#24291E" stroke="#805638"/><text x="103" y="170" fill="#FFF4E3" font-size="12">REQUEST</text><text x="103" y="188" fill="#C2B89D" font-size="10">plain language</text>
  <rect x="207" y="143" width="122" height="67" rx="10" fill="#24291E" stroke="#805638"/><text x="268" y="170" fill="#FFF4E3" font-size="12">PLAN</text><text x="268" y="188" fill="#C2B89D" font-size="10">break into steps</text>
  <rect x="372" y="143" width="122" height="67" rx="10" fill="#2D3022" stroke="#8A6346"/><text x="433" y="170" fill="#EAD5BC" font-size="12">TOOL CALL</text><text x="433" y="188" fill="#C7C1B2" font-size="10">Jira + retrieval</text>
  <rect x="537" y="143" width="142" height="67" rx="10" fill="#30291D" stroke="#D98752"><animate attributeName="stroke" values="#D98752;#E5BE67;#D98752" dur="2.8s" repeatCount="indefinite"/></rect><text x="608" y="170" fill="#FFF4E3" font-size="12">HUMAN CHECK</text><text x="608" y="188" fill="#E5BE67" font-size="10">approve / edit</text>
  <rect x="722" y="143" width="136" height="67" rx="10" fill="#2D3524" stroke="#7B8D5C"/><text x="790" y="170" fill="#FFF4E3" font-size="12">EXECUTE</text><text x="790" y="188" fill="#C2B89D" font-size="10">tracked action</text>
</g>
<g fill="#F3A16D"><circle r="4"><animateMotion dur="5s" repeatCount="indefinite" path="M103 176H790"/></circle><circle r="3"><animateMotion dur="5s" begin="-2.2s" repeatCount="indefinite" path="M103 176H790"/></circle></g>
<path d="M608 210v30h-175v-30" fill="none" stroke="#D98752" stroke-width="1.2" stroke-dasharray="4 5"><animate attributeName="stroke-dashoffset" from="0" to="-36" dur="3s" repeatCount="indefinite"/></path>
<text x="521" y="257" text-anchor="middle" fill="#F3A16D" font-family="monospace" font-size="10">SAFETY GATE BEFORE ACTION</text>
<text x="34" y="276" fill="#A99E85" font-family="monospace" font-size="11">UNDERSTAND → PLAN → RETRIEVE → REVIEW → ACT</text>
</svg>