<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="235" viewBox="0 0 1100 235" role="img" aria-labelledby="title desc">
<title id="title">Yashwant Kumar's animated developer terminal</title>
<desc id="desc">A dark terminal card with a live indicator, rotating typewriter focus messages for CogniOS, RAG systems, and AI agents.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0D1117"/><stop offset=".6" stop-color="#171B16"/><stop offset="1" stop-color="#25291D"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#A5C6E7"/><stop offset="1" stop-color="#818D42"/></linearGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="typing1"><rect x="57" y="124" width="0" height="28"><animate attributeName="width" values="0;0;430;430;0;0" keyTimes="0;0.05;0.20;0.28;0.33;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="typing2"><rect x="57" y="124" width="0" height="28"><animate attributeName="width" values="0;0;0;360;360;0;0" keyTimes="0;0.36;0.39;0.54;0.60;0.64;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
  <clipPath id="typing3"><rect x="57" y="124" width="0" height="28"><animate attributeName="width" values="0;0;0;410;410;0;0" keyTimes="0;0.68;0.71;0.86;0.92;0.96;1" dur="12s" repeatCount="indefinite"/></rect></clipPath>
</defs>
<rect width="1100" height="235" rx="18" fill="url(#bg)" stroke="#5E644D"/>
<path d="M1 50H1099" stroke="#5E644D"/>
<g>
  <circle cx="25" cy="25" r="5.5" fill="#A5C6E7"/><circle cx="44" cy="25" r="5.5" fill="#818D42"/><circle cx="63" cy="25" r="5.5" fill="#818D42"/>
  <text x="88" y="29" fill="#9D917A" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">yashwant@ai-lab: ~</text>
  <text x="1070" y="29" text-anchor="end" fill="#9D917A" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" letter-spacing="1.5">SESSION / ACTIVE</text>
  <circle cx="903" cy="25" r="4" fill="#A5C6E7" filter="url(#glow)"><animate attributeName="opacity" values=".35;1;.35" dur="1.8s" repeatCount="indefinite"/></circle>
</g>
<text x="36" y="79" fill="#A5C6E7" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">$ profile --now</text>
<text x="36" y="111" fill="#E3E4E5" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">Building useful AI, not just demos.</text>
<text x="36" y="144" fill="#A5C6E7" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14">$</text>
<g clip-path="url(#typing1)"><text x="57" y="144" fill="#E3E4E5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15"> Building CogniOS, a local-first AI workspace</text></g>
<g clip-path="url(#typing2)"><text x="57" y="144" fill="#E3E4E5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15"> Engineering RAG with grounded retrieval</text></g>
<g clip-path="url(#typing3)"><text x="57" y="144" fill="#E3E4E5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15"> Designing AI agents that take useful actions</text></g>
<rect x="57" y="151" width="7" height="17" rx="1.5" fill="#A5C6E7"><animate attributeName="x" values="57;57;487;487;57;57;57;417;417;57;57;467;467;57" keyTimes="0;0.05;0.20;0.28;0.33;0.36;0.39;0.54;0.60;0.64;0.68;0.86;0.92;1" dur="12s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0;1" dur=".9s" repeatCount="indefinite"/></rect>
<g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="600">
  <rect x="36" y="183" width="98" height="27" rx="6" fill="#373A26" stroke="#6C7C3E"/><text x="85" y="200" text-anchor="middle" fill="#A5C6E7">AI SYSTEMS</text>
  <rect x="143" y="183" width="65" height="27" rx="6" fill="#25291D" stroke="#6C7C3E"/><text x="175.5" y="200" text-anchor="middle" fill="#818D42">RAG</text>
  <rect x="217" y="183" width="91" height="27" rx="6" fill="#25291D" stroke="#6C7C3E"/><text x="262.5" y="200" text-anchor="middle" fill="#818D42">AI AGENTS</text>
  <rect x="317" y="183" width="77" height="27" rx="6" fill="#373A26" stroke="#6C7C3E"/><text x="355.5" y="200" text-anchor="middle" fill="#97B3CF">LOCAL AI</text>
</g>
<g transform="translate(1014 137)">
  <circle r="43" fill="none" stroke="#5E644D" stroke-width="1.2"/>
  <circle r="31" fill="none" stroke="#5E644D" stroke-dasharray="3 6"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/></circle>
  <circle r="17" fill="#373A26" stroke="url(#accent)" stroke-width="1.6"/>
  <text x="0" y="4" text-anchor="middle" fill="#E3E4E5" font-family="monospace" font-size="11" font-weight="700">AI</text>
  <circle cx="-31" cy="-11" r="3.4" fill="#A5C6E7"><animateMotion dur="6s" repeatCount="indefinite" path="M0 0 C42 -35 55 24 0 22 S-20 -8 0 0"/></circle>
  <circle cx="22" cy="25" r="3.1" fill="#818D42"><animate attributeName="r" values="2;4;2" dur="2.2s" repeatCount="indefinite"/></circle>
</g>
<text x="1068" y="218" text-anchor="end" fill="#9D917A" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="9" letter-spacing="1">TYPE / BUILD / SHIP</text>
</svg>