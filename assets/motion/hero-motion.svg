  <ellipse rx="103" ry="38" fill="none" stroke="#A5B58A" stroke-opacity=".72" stroke-width="1.4" transform="rotate(-38)"><animateTransform attributeName="transform" additive="sum" type="rotate" from="0" to="360" dur="32s" repeatCount="indefinite"/></ellipse>
