<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Yashwant Kumar | AI Systems Builder</title>
<desc id="desc">Animated neural systems banner with moving particles, network paths, orbital rings, and project themes.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11130F"/><stop offset=".58" stop-color="#191B15"/><stop offset="1" stop-color="#24261C"/></linearGradient>
  <linearGradient id="cyanViolet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F16A3A"/><stop offset="1" stop-color="#A5B58A"/></linearGradient>
  <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#F4EBDD"/><stop offset=".62" stop-color="#E5BE67"/><stop offset="1" stop-color="#A5B58A"/></linearGradient>
  <radialGradient id="aura"><stop stop-color="#596B43" stop-opacity=".28"/><stop offset="1" stop-color="#596B43" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#A5A18D" stroke-opacity=".09" stroke-width="1"/></pattern>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="390" rx="24" fill="url(#bg)"/>
<rect width="1200" height="390" rx="24" fill="url(#grid)"/>
<ellipse cx="960" cy="185" rx="300" ry="270" fill="url(#aura)"/>
<path d="M28 28H1172M28 362H1172" stroke="#414437" stroke-width="1"/>
<rect x="54" y="47" width="9" height="9" rx="3" fill="#F16A3A"><animate attributeName="opacity" values=".4;1;.4" dur="2s" repeatCount="indefinite"/></rect>
<text x="78" y="56" fill="#F3A16D" font-family="monospace" font-size="13" letter-spacing="3">INDEPENDENT BUILDER / INDIA</text>
<text x="54" y="128" fill="url(#headline)" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700" letter-spacing="-1.3">YASHWANT KUMAR</text>
<text x="57" y="164" fill="#D7D0C2" font-family="Arial, Helvetica, sans-serif" font-size="19">Building AI that does more than generate text.</text>
