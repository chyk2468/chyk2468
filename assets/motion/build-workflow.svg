<title id="title">Build Loop workflow</title><desc id="desc">From a clear problem to a system that ships</desc>
<rect width="1200" height="400" rx="18" fill="#0D1117"/>
<g opacity=".16" stroke="#5E644D" stroke-width="1"><path d="M0 30H1200M0 60H1200M0 90H1200M0 330H1200M0 360H1200M0 390H1200"/><path d="M30 0V400M60 0V400M90 0V400M1110 0V400M1140 0V400M1170 0V400"/></g>
<text x="56" y="42" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" fill="#818D42">PROJECT MAP / WORKFLOW</text>
<text x="56" y="78" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#E3E4E5">Build Loop</text>
<text x="56" y="105" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#9D917A">From a clear problem to a system that ships</text>
<line x1="56" y1="125" x2="1144" y2="125" stroke="#373A26" stroke-width="1"/>
<path d="M 300 237 L 330 237" stroke="#9D917A" stroke-width="1.8" fill="none"/><path d="M 325 232 L 330 237 L 325 242" stroke="#9D917A" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 584 237 L 614 237" stroke="#9D917A" stroke-width="1.8" fill="none"/><path d="M 609 232 L 614 237 L 609 242" stroke="#9D917A" stroke-width="1.8" fill="none" stroke-linejoin="round"/><path d="M 868 237 L 898 237" stroke="#9D917A" stroke-width="1.8" fill="none"/><path d="M 893 232 L 898 237 L 893 242" stroke="#9D917A" stroke-width="1.8" fill="none" stroke-linejoin="round"/><g><rect x="56" y="158" width="236" height="158" rx="12" fill="#171B16" stroke="#373A26" stroke-width="1.4"/><rect x="56" y="158" width="236" height="5" rx="2.5" fill="#818D42"/><text x="73" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#818D42">01 / SCOPE</text><text x="73" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#E3E4E5">Name the problem</text><text x="73" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#9D917A">Define users, constraints, and success.</text></g><g><rect x="340" y="158" width="236" height="158" rx="12" fill="#171B16" stroke="#373A26" stroke-width="1.4"/><rect x="340" y="158" width="236" height="5" rx="2.5" fill="#A5C6E7"/><text x="357" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#A5C6E7">02 / DESIGN</text><text x="357" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#E3E4E5">Map the system</text><text x="357" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#9D917A">Choose interfaces and a small first slice.</text></g><g><rect x="624" y="158" width="236" height="158" rx="12" fill="#171B16" stroke="#373A26" stroke-width="1.4"/><rect x="624" y="158" width="236" height="5" rx="2.5" fill="#6C7C3E"/><text x="641" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#6C7C3E">03 / BUILD</text><text x="641" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#E3E4E5">Implement + test</text><text x="641" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#9D917A">Ship a working path and verify it.</text></g><g><rect x="908" y="158" width="236" height="158" rx="12" fill="#171B16" stroke="#373A26" stroke-width="1.4"/><rect x="908" y="158" width="236" height="5" rx="2.5" fill="#818D42"/><text x="925" y="187" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.3" fill="#818D42">04 / ITERATE</text><text x="925" y="221" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#E3E4E5">Observe + improve</text><text x="925" y="249" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#9D917A">Use results to choose the next change.</text></g>
<circle r="4" fill="#A5C6E7"><animateMotion dur="8s" repeatCount="indefinite" path="M 296 237 L 344 237 L 580 237 L 628 237 L 864 237 L 912 237"/></circle><circle r="2" fill="#818D42"><animateMotion dur="8s" begin="-4s" repeatCount="indefinite" path="M 296 237 L 344 237 L 580 237 L 628 237 L 864 237 L 912 237"/></circle>
<text x="56" y="358" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="700" letter-spacing="1.5" fill="#818D42">IMPLEMENTATION NOTE</text>
<text x="56" y="380" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#9D917A">A practical engineering loop: keep the scope small, verify behavior, then iterate.</text></svg>