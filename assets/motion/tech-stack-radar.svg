<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
<title id="title">Yashwant Kumar's animated technology stack radar</title>
<desc id="desc">A dark animated systems diagram grouping AI and data, LLM systems, backend engineering, and infrastructure tools.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070C16"/><stop offset=".55" stop-color="#0C1729"/><stop offset="1" stop-color="#10152D"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#56F2D0"/><stop offset="1" stop-color="#8F7BFF"/></linearGradient>
  <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#51E4CE"/><stop offset="1" stop-color="#7D8CFF"/></linearGradient>
  <radialGradient id="core"><stop stop-color="#1A3D4A"/><stop offset="1" stop-color="#0B1727"/></radialGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#7894BF" stroke-opacity=".065" stroke-width="1"/></pattern>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .panel{fill:#101C2D;stroke:#283B58;stroke-width:1}
    .category{font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1.2px}
    .tag{fill:#14263A;stroke:#2E4965;stroke-width:1}
    .tagtext{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;fill:#D9E8F8}
  </style>
</defs>
<rect width="1100" height="520" rx="22" fill="url(#bg)"/>
<rect width="1100" height="520" rx="22" fill="url(#grid)"/>
<path d="M26 52H1074" stroke="#263854"/>
<text x="34" y="34" fill="#8DEBDD" font-family="monospace" font-size="11" letter-spacing="2.5">04 / THE TOOLCHAIN</text>
<text x="1066" y="34" text-anchor="end" fill="#657A9A" font-family="monospace" font-size="10" letter-spacing="1.4">SYSTEMS THINKING · PRACTICAL BUILDING</text>
<!-- Animated stack core -->
<g transform="translate(202 270)">
  <circle r="139" fill="none" stroke="#243754" stroke-width="1"/>
  <circle r="119" fill="none" stroke="#375073" stroke-dasharray="2 8" stroke-width="1.2"/>
  <circle r="94" fill="none" stroke="#3C547A" stroke-dasharray="6 9" stroke-width="1.4">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="44s" repeatCount="indefinite"/>
  </circle>
  <ellipse rx="112" ry="43" transform="rotate(-32)" fill="none" stroke="#56E8D0" stroke-opacity=".7" stroke-width="1.4">
    <animateTransform attributeName="transform" additive="sum" type="rotate" from="0" to="360" dur="26s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse rx="112" ry="43" transform="rotate(52)" fill="none" stroke="#8C80FF" stroke-opacity=".8" stroke-width="1.4">
    <animateTransform attributeName="transform" additive="sum" type="rotate" from="360" to="0" dur="31s" repeatCount="indefinite"/>
  </ellipse>
  <circle r="66" fill="url(#core)" stroke="url(#accent)" stroke-width="2" filter="url(#glow)"/>
  <circle r="51" fill="none" stroke="#56E8D0" stroke-opacity=".45" stroke-width="1">
    <animate attributeName="r" values="46;56;46" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <text x="0" y="-3" text-anchor="middle" fill="#F0FFFB" font-family="monospace" font-size="17" font-weight="700">BUILD</text>
  <text x="0" y="17" text-anchor="middle" fill="#91B6C9" font-family="monospace" font-size="10" letter-spacing="1.5">SYSTEMS</text>
  <circle cx="-112" cy="-43" r="4.5" fill="#56F2D0" filter="url(#glow)"><animateMotion dur="9s" repeatCount="indefinite" path="M0 0 C70 -65 180 -7 112 72 S-38 55 0 0"/></circle>
  <circle cx="90" cy="57" r="4" fill="#9B8AFF"><animateMotion dur="7.6s" repeatCount="indefinite" path="M0 0 C-80 -74 -151 19 -55 94 S95 52 0 0"/></circle>
  <circle cx="0" cy="-119" r="3" fill="#FFFFFF"><animate attributeName="opacity" values=".2;1;.2" dur="1.9s" repeatCount="indefinite"/></circle>
</g>
<text x="202" y="440" text-anchor="middle" fill="#8FA1BE" font-family="monospace" font-size="10" letter-spacing="1.5">AI / DATA / SOFTWARE / INFRA</text>
<text x="202" y="458" text-anchor="middle" fill="#596D8D" font-family="monospace" font-size="9">A CONNECTED TOOLCHAIN</text>
<!-- Data streams connecting core and categories -->
<g fill="none" stroke="url(#accent2)" stroke-width="1.2" stroke-opacity=".68">
  <path d="M314 226 C343 205 344 113 373 113"/>
  <path d="M321 262 C349 244 346 213 373 213"/>
  <path d="M321 293 C349 307 347 320 373 320"/>
  <path d="M306 326 C347 370 343 426 373 426"/>
</g>
<g fill="#67EBD3" filter="url(#glow)">
  <circle r="3.5"><animateMotion dur="3.8s" repeatCount="indefinite" path="M314 226 C343 205 344 113 373 113"/></circle>
  <circle r="3.5"><animateMotion dur="3.3s" begin="-1.1s" repeatCount="indefinite" path="M321 262 C349 244 346 213 373 213"/></circle>
  <circle r="3.5"><animateMotion dur="4.2s" begin="-1.6s" repeatCount="indefinite" path="M321 293 C349 307 347 320 373 320"/></circle>
  <circle r="3.5"><animateMotion dur="3.5s" begin="-2s" repeatCount="indefinite" path="M306 326 C347 370 343 426 373 426"/></circle>
</g>
<!-- Cards -->
<g>
  <rect class="panel" x="373" y="68" width="694" height="90" rx="12"/>
  <rect x="373" y="68" width="4" height="90" rx="2" fill="#56E8D0"/>
  <text class="category" x="393" y="89" fill="#6FEBD4">01  AI / MACHINE LEARNING</text>
  <g transform="translate(393 101)">
    <rect class="tag" width="76" height="24" rx="6"/><text class="tagtext" x="38" y="16" text-anchor="middle">Python</text>
    <rect class="tag" x="84" width="80" height="24" rx="6"/><text class="tagtext" x="124" y="16" text-anchor="middle">PyTorch</text>
    <rect class="tag" x="172" width="91" height="24" rx="6"/><text class="tagtext" x="217.5" y="16" text-anchor="middle">TensorFlow</text>
    <rect class="tag" x="271" width="94" height="24" rx="6"/><text class="tagtext" x="318" y="16" text-anchor="middle">scikit-learn</text>
    <rect class="tag" x="373" width="105" height="24" rx="6"/><text class="tagtext" x="425.5" y="16" text-anchor="middle">Hugging Face</text>
    <rect class="tag" x="486" width="78" height="24" rx="6"/><text class="tagtext" x="525" y="16" text-anchor="middle">OpenCV</text>
    <rect class="tag" x="0" y="30" width="73" height="24" rx="6"/><text class="tagtext" x="36.5" y="46" text-anchor="middle">NumPy</text>
    <rect class="tag" x="81" y="30" width="76" height="24" rx="6"/><text class="tagtext" x="119" y="46" text-anchor="middle">Pandas</text>
  </g>
  <rect class="panel" x="373" y="171" width="694" height="75" rx="12"/>
  <rect x="373" y="171" width="4" height="75" rx="2" fill="#9B8AFF"/>
  <text class="category" x="393" y="192" fill="#B9A9FF">02  LLM SYSTEMS</text>
  <g transform="translate(393 204)">
    <rect class="tag" width="54" height="24" rx="6"/><text class="tagtext" x="27" y="16" text-anchor="middle">RAG</text>
    <rect class="tag" x="62" width="100" height="24" rx="6"/><text class="tagtext" x="112" y="16" text-anchor="middle">Embeddings</text>
    <rect class="tag" x="170" width="126" height="24" rx="6"/><text class="tagtext" x="233" y="16" text-anchor="middle">Semantic Search</text>
    <rect class="tag" x="304" width="83" height="24" rx="6"/><text class="tagtext" x="345.5" y="16" text-anchor="middle">Ollama</text>
    <rect class="tag" x="395" width="91" height="24" rx="6"/><text class="tagtext" x="440.5" y="16" text-anchor="middle">AI Agents</text>
  </g>
  <rect class="panel" x="373" y="259" width="694" height="91" rx="12"/>
  <rect x="373" y="259" width="4" height="91" rx="2" fill="#71A6FF"/>
  <text class="category" x="393" y="280" fill="#9BBEFF">03  BACKEND / WEB</text>
  <g transform="translate(393 292)">
    <rect class="tag" width="89" height="24" rx="6"/><text class="tagtext" x="44.5" y="16" text-anchor="middle">JavaScript</text>
    <rect class="tag" x="97" width="84" height="24" rx="6"/><text class="tagtext" x="139" y="16" text-anchor="middle">Node.js</text>
    <rect class="tag" x="189" width="70" height="24" rx="6"/><text class="tagtext" x="224" y="16" text-anchor="middle">React</text>
    <rect class="tag" x="267" width="73" height="24" rx="6"/><text class="tagtext" x="303.5" y="16" text-anchor="middle">Flask</text>
    <rect class="tag" x="348" width="91" height="24" rx="6"/><text class="tagtext" x="393.5" y="16" text-anchor="middle">FastAPI</text>
    <rect class="tag" x="447" width="98" height="24" rx="6"/><text class="tagtext" x="496" y="16" text-anchor="middle">Streamlit</text>
    <rect class="tag" x="0" y="30" width="99" height="24" rx="6"/><text class="tagtext" x="49.5" y="46" text-anchor="middle">HTML / CSS</text>
  </g>
  <rect class="panel" x="373" y="363" width="694" height="91" rx="12"/>
  <rect x="373" y="363" width="4" height="91" rx="2" fill="#E4B36D"/>
  <text class="category" x="393" y="384" fill="#F0C989">04  DATA / INFRASTRUCTURE</text>
  <g transform="translate(393 396)">
    <rect class="tag" width="59" height="24" rx="6"/><text class="tagtext" x="29.5" y="16" text-anchor="middle">SQL</text>
    <rect class="tag" x="67" width="75" height="24" rx="6"/><text class="tagtext" x="104.5" y="16" text-anchor="middle">MySQL</text>
    <rect class="tag" x="150" width="91" height="24" rx="6"/><text class="tagtext" x="195.5" y="16" text-anchor="middle">MongoDB</text>
    <rect class="tag" x="249" width="79" height="24" rx="6"/><text class="tagtext" x="288.5" y="16" text-anchor="middle">Docker</text>
    <rect class="tag" x="336" width="74" height="24" rx="6"/><text class="tagtext" x="373" y="16" text-anchor="middle">Linux</text>
    <rect class="tag" x="418" width="61" height="24" rx="6"/><text class="tagtext" x="448.5" y="16" text-anchor="middle">Git</text>
    <rect class="tag" x="487" width="65" height="24" rx="6"/><text class="tagtext" x="519.5" y="16" text-anchor="middle">AWS</text>
    <rect class="tag" x="0" y="30" width="83" height="24" rx="6"/><text class="tagtext" x="41.5" y="46" text-anchor="middle">Jupyter</text>
  </g>
</g>
<text x="1067" y="490" text-anchor="end" fill="#617794" font-family="monospace" font-size="9" letter-spacing="1.5">TOOLS ARE THE MEDIUM. SYSTEMS ARE THE GOAL.</text>
</svg>